<!doctype html>
<html><head><meta charset="utf-8">
<style>
/*__CSS__*/
#root { height: 100vh; display: grid; grid-template-columns: 1fr 240px; grid-template-rows: 1fr auto; gap: 0; border: 1px solid var(--line); }
.box { position: relative; }
.box > .label { position: absolute; top: 12px; left: 14px; right: 14px; }
.big { position: absolute; top: 30px; left: 14px; font-family: 'IBM Plex Mono'; font-weight: 500; font-size: 17px; }
.list { padding: 36px 16px 12px; overflow: hidden; border-left: 1px solid var(--line); position: relative; }
.it { margin: 0 0 10px; font-size: 12px; }
.it .h { display: flex; justify-content: space-between; font-family: 'IBM Plex Mono'; color: var(--ink); }
.it .b { height: 3px; background: var(--inset); margin-top: 4px; overflow: hidden; }
.it .b i { display: block; height: 100%; }
.tl { grid-column: 1 / 3; display: flex; gap: 12px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); }
#tl { flex: 1; height: 34px; cursor: pointer; }
.legend { display: flex; gap: 8px; align-items: center; font-family: 'IBM Plex Mono'; font-size: 10.5px; color: var(--ink2); position: absolute; right: 14px; bottom: 12px; z-index: 2; }
.legend i { width: 110px; height: 8px; display: inline-block; border: 1px solid var(--line); }
</style></head>
<body><div id="root">
  <div class="box"><div class="label" id="title"></div><div class="big" id="flabel"></div>
    <div class="legend"><span id="lo">low</span><i id="lg"></i><span id="hi">high</span></div>
    <canvas id="head" class="cv"></canvas></div>
  <div class="list"><div class="label" style="position:absolute;top:12px;left:16px" id="ltitle">Most active channels</div><div id="list"></div></div>
  <div class="tl" id="tlbox"><button class="ns" id="pp"></button><canvas id="tl"></canvas><span class="mono" id="fi" style="font-size:12px;color:var(--ink3);min-width:64px;text-align:right"></span></div>
</div>
<script>
/*__JS__*/
const D = __DATA__;
const stops = D.stops === 'xray' ? NS.XRAY : NS.STORM;
const F = D.frames, nF = F.length;
document.getElementById('title').textContent = D.title || '';
document.getElementById('ltitle').textContent = D.list_title || 'Most active channels';
document.getElementById('lo').textContent = D.lo || 'low'; document.getElementById('hi').textContent = D.hi || 'high';
document.getElementById('lg').style.background = `linear-gradient(90deg, ${[0, .25, .5, .75, 1].map(v => NS.rgb(NS.cmap(v, stops))).join(',')})`;
if (nF < 2) { document.getElementById('tlbox').style.display = 'none'; document.getElementById('root').style.gridTemplateRows = '1fr'; }
if (D.compact) { document.getElementById('root').style.gridTemplateColumns = '1fr'; document.querySelector('.list').style.display = 'none'; }
let fi = D.start || 0, playing = nF > 1 && D.autoplay !== false, acc = 0, last = null, cur = F[fi].slice();
const cvH = document.getElementById('head'), cvT = document.getElementById('tl');
let gH, gT; const rs = () => { gH = NS.setupCanvas(cvH); if (nF > 1) gT = NS.setupCanvas(cvT); }; window.addEventListener('resize', rs); rs();
const pp = document.getElementById('pp');
const setPP = () => pp.innerHTML = NS.icon(playing ? 'pause' : 'play', 15);
pp.onclick = () => { playing = !playing; setPP(); }; setPP();
cvT.addEventListener('click', e => { const r = cvT.getBoundingClientRect(); fi = Math.max(0, Math.min(nF - 1, Math.round((e.clientX - r.left) / r.width * (nF - 1)))); });
function list() {
  const ix = cur.map((v, i) => [v, i]).sort((a, b) => b[0] - a[0]).slice(0, 8);
  document.getElementById('list').innerHTML = ix.map(([v, i]) => `<div class="it"><div class="h"><span>${D.channels[i]}</span><span>${(D.raw ? D.raw[fi][i] : v).toFixed(D.decimals ?? 2)}</span></div><div class="b"><i style="width:${v * 100}%;background:${NS.rgb(NS.cmap(0.35 + 0.65 * v, stops))}"></i></div></div>`).join('');
}
function frame(now) {
  if (last === null) last = now; const dt = (now - last) / 1000; last = now;
  if (playing) { acc += dt * (D.fps || 4); while (acc >= 1) { acc -= 1; fi = (fi + 1) % nF; } }
  F[fi].forEach((v, i) => cur[i] += (v - cur[i]) * 0.25);
  const { ctx, w, h } = gH; ctx.clearRect(0, 0, w, h);
  const R = Math.min(w, h - 44) / 2 * 0.84;
  const ictal = D.marks && D.marks[fi];
  NS.drawHead(ctx, w / 2, h / 2 + 16, R, D.channels, cur, { stops, haloColor: ictal ? NS.C.seizure : NS.C.cyan });
  const fl = document.getElementById('flabel'); fl.textContent = (D.labels ? D.labels[fi] : '') + (ictal ? '  ·  ICTAL' : '');
  fl.style.color = ictal ? NS.C.seizure : NS.C.ink;
  if (nF > 1) {
    const { ctx: c, w: tw, h: th } = gT; c.clearRect(0, 0, tw, th);
    for (let i = 0; i < nF; i++) { const x = i / nF * tw, ww = Math.max(1, tw / nF - 1);
      const m = F[i].reduce((a, b) => a + b, 0) / F[i].length;
      c.fillStyle = D.marks && D.marks[i] ? NS.C.seizure : NS.C.fillMuted;
      const hh = 4 + (th - 8) * m; c.fillRect(x, th - hh, ww, hh); }
    c.fillStyle = NS.C.ink; c.fillRect(fi / (nF - 1) * (tw - 2), 0, 2, th);
    document.getElementById('fi').textContent = `${fi + 1} / ${nF}`;
  }
  if (Math.round(now / 150) !== Math.round((now - dt * 1000) / 150)) list();
  requestAnimationFrame(frame);
}
list(); requestAnimationFrame(frame);
</script></body></html>
